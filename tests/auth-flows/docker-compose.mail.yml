# Adds a throwaway mail catcher to the pos-isotest stack so emailed links can be
# tested without a real provider. Used with tests/tenant-isolation/docker-compose.isotest.yml.
services:
  mailpit:
    image: axllent/mailpit:v1.21.8
    container_name: pos-isotest-mailpit
    mem_limit: 128m
  backend:
    environment:
      SMTP_URL: "smtp://mailpit:1025"
      SMTP_FROM: "Komyosys POS <no-reply@komyosys.ai>"
