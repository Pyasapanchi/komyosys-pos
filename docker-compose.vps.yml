# VPS override for 191.101.1.148 (shared production host behind Traefik).
# Use with: docker compose -f docker-compose.yml -f docker-compose.vps.yml ...
services:
  backend:
    # No USB printer on a VPS: drop the host /dev/bus/usb mount and device grants.
    volumes: !override
      - uploads_data:/data/uploads
    device_cgroup_rules: !reset []
    environment:
      # Self-updater disabled (it pulls upstream images via the Docker socket).
      UPDATER_URL: ""
      # Rate-limit per real visitor, not per web container. Safe only because
      # Traefik accepts this site's traffic from Cloudflare alone (see
      # komyosys-pos-cloudflare-only below), which sets this header itself.
      CLIENT_IP_HEADER: cf-connecting-ip
    mem_limit: 1g

  web:
    # No published host port: reached only through Traefik over HTTPS.
    ports: !reset []
    networks:
      - default
      - traefik
    mem_limit: 768m
    environment:
      # Next binds to $HOSTNAME (the container id) by default, which resolves to
      # only one network; listen on all so Traefik's network can reach it.
      HOSTNAME: "0.0.0.0"
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik-global_default
      traefik.http.routers.komyosys-pos.entrypoints: websecure
      traefik.http.routers.komyosys-pos.rule: 'Host(`pos.komyosys.ai`)'
      traefik.http.routers.komyosys-pos.service: komyosys-pos-svc
      traefik.http.routers.komyosys-pos.tls: "true"
      traefik.http.routers.komyosys-pos.tls.certresolver: mytls
      traefik.http.services.komyosys-pos-svc.loadbalancer.server.port: "3000"
      # Only Cloudflare may reach the site, so nobody can bypass it and forge
      # cf-connecting-ip by hitting the server IP directly. Keep the DNS record
      # proxied (orange cloud). Ranges: https://www.cloudflare.com/ips (31 Oct 2026).
      traefik.http.routers.komyosys-pos.middlewares: komyosys-pos-cloudflare-only
      traefik.http.middlewares.komyosys-pos-cloudflare-only.ipallowlist.sourcerange: "173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"
      # Hosted lockdown: block the APIs that act on the whole database rather
      # than one restaurant: backups, Server Sync (and its peer endpoints) and
      # system updates (see deploy/vps-lockdown.sql). An allow-list of only
      # 127.0.0.1 means every real request is refused with 403. Case-insensitive
      # and tolerant of repeated slashes, since Express routes case-insensitively.
      traefik.http.routers.komyosys-pos-deny.entrypoints: websecure
      traefik.http.routers.komyosys-pos-deny.rule: 'Host(`pos.komyosys.ai`) && (PathRegexp(`(?i)^/+api/+v1/+backups`) || PathRegexp(`(?i)^/+api/+v1/+sync`) || PathRegexp(`(?i)^/+api/+v1/+system`))'
      traefik.http.routers.komyosys-pos-deny.priority: "1000"
      traefik.http.routers.komyosys-pos-deny.service: komyosys-pos-svc
      traefik.http.routers.komyosys-pos-deny.middlewares: komyosys-pos-deny-all
      traefik.http.routers.komyosys-pos-deny.tls: "true"
      traefik.http.routers.komyosys-pos-deny.tls.certresolver: mytls
      traefik.http.middlewares.komyosys-pos-deny-all.ipallowlist.sourcerange: 127.0.0.1/32

  postgres:
    mem_limit: 512m

  updater:
    profiles: ["disabled"]

networks:
  traefik:
    external: true
    name: traefik-global_default
